<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <link rel="stylesheet" href="../estilos2.css"/>
</head>
<body>
    
    <div><p class="titulo">Registro de usuario</p></div>
 
    <div><label class="x1">Nombre</label><input id="InputNombre" type="text"></div>
    <div><label class="x1">Apellido</label><input id="InputApellido" type="text"></div>
    
    <div>
        <label class="x1">Cédula</label>
        <div class="campo-cedula">
            <span class="prefijo">V-</span>
            <input id="InputCedula" type="text" placeholder="12345678">
        </div>
    </div>
    
    <button class="Boton1" id="btnagregar">Agregar</button>
    
    <table class="tabla1">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Cédula</th>
                <th>Acción</th>
            </tr>
        </thead>
    
        <tbody id="Contenidotabla"></tbody>
    </table>

</body>

</html>
